# Builds the browser version of the game and publishes it to GitHub Pages
# (https://dbliss.github.io/10-1/). Everything runs in the visitor's browser:
# Pyodide runs the Python, and the C core is compiled to WebAssembly here.
#
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Must match the Pyodide release in frontend/src/worker/engine.ts
      # (Pyodide 314.0.8 is built with Emscripten 5.0.3).
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.3

      - name: Package the Python and the WebAssembly core
        run: python browser_build.py --emcc emcc

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the site
        working-directory: frontend
        run: |
          npm ci
          npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
