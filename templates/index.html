<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Oh Hell (10 to 1)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Oh Hell (10 to 1)</h1>
    <div id="config-box" style="position:absolute;top:0;left:0;padding:10px;">
        <label>Players:
            <input id="numPlayers" type="number" value="4" min="2" max="8">
        </label>
        <label>Rounds:
            <input id="numRounds" type="number" value="5" min="1" max="10">
        </label>
        <button onclick="startGame()">Start Game</button>
        <button onclick="post('/reset')">Reset Game</button>
    </div>
    <div id="bid-box" style="display:none;">
        <label>Bid: <input id="bid" type="number" min="0"></label>
        <button onclick="makeBid()">Submit Bid</button>
    </div>
    <h3 id="round-info"></h3>
    <div id="scoreboard" style="position:fixed;top:0;right:0;width:200px;">
        <h3>Scores</h3>
        <div id="score-content"></div>
    </div>
    <div id="game-container">
        <div id="table">
            <div id="trump-card"></div>
            <div id="trick-stack"></div>
        </div>
    </div>
    <script>
    async function post(url, data={}) {
        await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
        await update();
    }

    async function startGame(){
        const players = document.getElementById('numPlayers').value;
        const rounds = document.getElementById('numRounds').value;
        await post('/start', {players: players, rounds: rounds});
        document.getElementById('bid-box').style.display = 'block';
        document.getElementById('config-box').style.display = 'none';
    }

    async function makeBid() {
        const bid = document.getElementById('bid').value;
        await post('/bid', {bid: bid});
    }

    function playCard(card){
        post('/play', {card: card});
    }

    function renderState(data){
        document.getElementById('round-info').textContent = 'Round: ' + data.round;
        const table = document.getElementById('table');
        table.innerHTML = '<div id="trump-card"></div><div id="trick-stack"></div>';

        const trump = document.getElementById('trump-card');
        if(data.trump_card){
            trump.innerHTML = '<img src="'+data.trump_card+'" width="60" height="80">';
        }else{
            trump.textContent = 'No Trump';
        }

        const seats = 8;
        const center = 300;
        const radius = 250;
        for(let i=0;i<seats;i++){
            const seat = document.createElement('div');
            seat.className = 'seat';
            const angle = (2*Math.PI/seats)*i;
            seat.style.left = (center + radius*Math.cos(angle)) + 'px';
            seat.style.top = (center + radius*Math.sin(angle)) + 'px';

            const p = data.players[i];
            if(p){
                const name = document.createElement('div');
                name.textContent = p.name;
                if(p.name === data.dealer){
                    const chip = document.createElement('span');
                    chip.className = 'dealer-chip';
                    name.appendChild(chip);
                }
                seat.appendChild(name);
                const cardDiv = document.createElement('div');
                cardDiv.className = 'cards';
                if(p.cards.length){
                    p.cards.forEach(c=>{
                        const img = document.createElement('img');
                        img.src = c;
                        img.style.width = '40px';
                        img.style.height = '60px';
                        img.onclick = ()=>{
                            const id = c.split('/').pop().replace('.png','');
                            playCard(id);
                        };
                        cardDiv.appendChild(img);
                    });
                } else {
                    for(let j=0;j<p.num_cards;j++){
                        const back = document.createElement('div');
                        back.className = 'card-back';
                        cardDiv.appendChild(back);
                    }
                }
            seat.appendChild(cardDiv);
            const won = document.createElement('div');
            won.className = 'won';
            if(data.won_piles[p.name]){
                data.won_piles[p.name].forEach((c,i)=>{
                    const img = document.createElement('img');
                    img.src = c;
                    img.style.width = '20px';
                    img.style.height = '30px';
                    img.style.position = 'absolute';
                    img.style.left = (Math.floor(i/2)*5)+'px';
                    img.style.top = (i%2)*8+'px';
                    img.style.transform = i%2 ? 'rotate(90deg)' : 'rotate(0deg)';
                    won.appendChild(img);
                });
            }
            seat.appendChild(won);
            } else {
                seat.textContent = 'Empty';
            }
            table.appendChild(seat);
        }

        const stack = document.getElementById('trick-stack');
        stack.innerHTML = '';
        if(data.trick){
            data.trick.forEach((t,i)=>{
                const img = document.createElement('img');
                img.src = t.card;
                img.style.width = '50px';
                img.style.height = '70px';
                img.style.position = 'absolute';
                img.style.left = (i*20)+'px';
                stack.appendChild(img);
            });
        }

        const sc = document.getElementById('score-content');
        sc.innerHTML = '';
        data.players.forEach(pl=>{
            const line = document.createElement('div');
            line.textContent = pl.name + ' - Score: ' + pl.score + (pl.bid !== null ? ' Bid: '+pl.bid : '');
            sc.appendChild(line);
        });
    }

    async function update(){
        const res = await fetch('/state');
        const data = await res.json();
        renderState(data);
    }

    update();
    setInterval(update, 1000);
    </script>
</body>
</html>
