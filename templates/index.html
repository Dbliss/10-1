<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Oh Hell (10 to 1)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Oh Hell (10 to 1)</h1>
    <button onclick="post('/start')">Start Game</button>
    <button onclick="post('/reset')">Reset Game</button>
    <div>
        <label>Bid: <input id="bid" type="number" min="0"></label>
        <button onclick="makeBid()">Submit Bid</button>
    </div>
    <h3 id="round-info"></h3>
    <div id="game-container">
        <div id="table">
            <div id="trump-card"></div>
        </div>
        <div id="scoreboard">
            <h3>Scores</h3>
            <div id="score-content"></div>
        </div>
    </div>
    <script>
    async function post(url, data={}) {
        await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
        await update();
    }

    async function makeBid() {
        const bid = document.getElementById('bid').value;
        await post('/bid', {bid: bid});
    }

    function renderState(data){
        document.getElementById('round-info').textContent = 'Round: ' + data.round;
        const table = document.getElementById('table');
        table.innerHTML = '<div id="trump-card"></div>';

        const trump = document.getElementById('trump-card');
        if(data.trump_card){
            trump.innerHTML = '<img src="'+data.trump_card+'" width="60" height="80">';
        }else{
            trump.textContent = 'No Trump';
        }

        const seats = 8;
        const center = 300;
        const radius = 250;
        for(let i=0;i<seats;i++){
            const seat = document.createElement('div');
            seat.className = 'seat';
            const angle = (2*Math.PI/seats)*i;
            seat.style.left = (center + radius*Math.cos(angle)) + 'px';
            seat.style.top = (center + radius*Math.sin(angle)) + 'px';

            const p = data.players[i];
            if(p){
                const name = document.createElement('div');
                name.textContent = p.name;
                if(p.name === data.dealer){
                    const chip = document.createElement('span');
                    chip.className = 'dealer-chip';
                    name.appendChild(chip);
                }
                seat.appendChild(name);
                const cardDiv = document.createElement('div');
                cardDiv.className = 'cards';
                if(p.cards.length){
                    p.cards.forEach(c=>{
                        const img = document.createElement('img');
                        img.src = c;
                        img.style.width = '40px';
                        img.style.height = '60px';
                        cardDiv.appendChild(img);
                    });
                } else {
                    for(let j=0;j<p.num_cards;j++){
                        const back = document.createElement('div');
                        back.className = 'card-back';
                        cardDiv.appendChild(back);
                    }
                }
                seat.appendChild(cardDiv);
            } else {
                seat.textContent = 'Empty';
            }
            table.appendChild(seat);
        }

        const sc = document.getElementById('score-content');
        sc.innerHTML = '';
        data.players.forEach(pl=>{
            const line = document.createElement('div');
            line.textContent = pl.name + ' - Score: ' + pl.score + (pl.bid !== null ? ' Bid: '+pl.bid : '');
            sc.appendChild(line);
        });
    }

    async function update(){
        const res = await fetch('/state');
        const data = await res.json();
        renderState(data);
    }

    update();
    </script>
</body>
</html>
